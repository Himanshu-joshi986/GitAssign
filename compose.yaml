name: gitassign

services:
  backend:
    build:
      context: ./backend
    image: gitassign/backend:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data                     # persistent SQLite DB + GitHub cache
      - ./datasets:/app/datasets:ro          # local CSV datasets (read-only)
      - ./docs:/app/docs                     # ablation results are written here
      - ./backend/config:/app/config         # tune weights without rebuilding
    environment:
      DB_PATH: data/gitassign.db
      CACHE_DIR: data/cache
      WEIGHTS_PATH: config/weights.json
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MAX_COMMIT_DETAILS: ${MAX_COMMIT_DETAILS:-200}
      LIVE_SYNC_INTERVAL_SECONDS: ${LIVE_SYNC_INTERVAL_SECONDS:-60}
      AUTO_ASSIGN_NEW_ISSUES: ${AUTO_ASSIGN_NEW_ISSUES:-false}
      AUTO_ASSIGN_CAPACITY: ${AUTO_ASSIGN_CAPACITY:-3}
      AUTO_NOTIFY_DEVELOPER: ${AUTO_NOTIFY_DEVELOPER:-false}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-60}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_MAX_ISSUES_PER_RUN: ${LLM_MAX_ISSUES_PER_RUN:-50}
      LLM_MAX_PROFILES_PER_RUN: ${LLM_MAX_PROFILES_PER_RUN:-100}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
    image: gitassign/frontend:latest
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
